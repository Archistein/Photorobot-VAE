repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types: [python]
      - id: poetry-check
        name: Poetry lock consistency
        entry: poetry check --lock
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false
