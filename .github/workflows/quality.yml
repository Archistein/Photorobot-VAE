name: Quality

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.1.2
      - name: Install locked dependencies
        run: poetry install --with dev --no-interaction
      - name: Check Poetry metadata and lock file
        run: poetry check --lock
      - name: Validate pre-commit configuration
        run: poetry run pre-commit validate-config
      - name: Check Ruff lint
        run: poetry run ruff check src quality_tests
      - name: Check Ruff formatting
        run: poetry run ruff format --check src quality_tests
      - name: Check types
        run: poetry run mypy src
      - name: Run unit tests
        run: poetry run pytest
      - name: Run pre-commit on tracked files
        run: poetry run pre-commit run --all-files
